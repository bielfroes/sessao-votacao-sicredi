server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5441/assembly}
spring.datasource.username=${DB_USERNAME:assembly}
spring.datasource.password=${DB_PASSWORD:12345}
spring.jpa.database=POSTGRESQL
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
app.time-zone=${APP_TIME_ZONE:America/Sao_Paulo}
app.voting.default-duration-minutes=${DEFAULT_VOTING_DURATION_MINUTES:1}
app.voting.expiration-check-delay-ms=${VOTING_EXPIRATION_CHECK_DELAY_MS:60000}
app.mobile.screens-location=${MOBILE_SCREENS_LOCATION:classpath:sdui/mobile-screens.json}
app.mobile.survey-limit=${MOBILE_SURVEY_LIMIT:100}
app.mobile.consul.enabled=${MOBILE_CONSUL_ENABLED:true}
app.mobile.consul.address=${MOBILE_CONSUL_ADDRESS:http://localhost:8500}
app.mobile.consul.key=${MOBILE_CONSUL_KEY:sdui/mobile-screens}
app.mobile.consul.token=${MOBILE_CONSUL_TOKEN:}
app.mobile.consul.poll-interval-ms=${MOBILE_CONSUL_POLL_INTERVAL_MS:5000}
app.mobile.consul.connect-timeout=${MOBILE_CONSUL_CONNECT_TIMEOUT:PT2S}
app.mobile.consul.read-timeout=${MOBILE_CONSUL_READ_TIMEOUT:PT3S}
app.eligibility.enabled=${ELIGIBILITY_ENABLED:false}
app.eligibility.base-url=${ELIGIBILITY_SERVICE_URL:https://user-info.herokuapp.com}
app.eligibility.connect-timeout=${ELIGIBILITY_CONNECT_TIMEOUT:PT2S}
app.eligibility.read-timeout=${ELIGIBILITY_READ_TIMEOUT:PT3S}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:assembly}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:12345}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=${RABBITMQ_HEALTH_ENABLED:false}
logging.pattern.level=%5p [correlationId:%X{correlationId}]
